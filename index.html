<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой вишлист</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fff4f6; --peach:#ffd9dc; --blush:#fbd3dc; --rose:#f2a7b8; --rose-deep:#d9708a;
  --lav:#f0dff5; --lav-deep:#a07ab8; --beige:#ffe9e3; --ink:#5e3a46; --gold:#c9956b;
  --shadow:0 12px 32px rgba(217,112,138,.18);
}
*{box-sizing:border-box;margin:0}
body{
  font-family:'Nunito',system-ui,sans-serif;color:var(--ink);line-height:1.6;min-height:100vh;
  background:
    radial-gradient(circle at 8% 0%,var(--blush) 0,transparent 42%),
    radial-gradient(circle at 95% 10%,var(--lav) 0,transparent 40%),
    radial-gradient(circle at 50% 100%,var(--peach) 0,transparent 50%),
    var(--cream);
  background-attachment:fixed;
}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;line-height:1.15}
.hero{position:relative;text-align:center;padding:72px 20px 36px}
.hero h1{
  font-size:clamp(2.8rem,8vw,5rem);
  background:linear-gradient(120deg,var(--rose-deep),var(--gold) 55%,var(--rose-deep));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:rise 1s ease both;
}
.hero p{max-width:34rem;margin:14px auto 0;font-size:1.05rem;opacity:.85;animation:rise 1s .2s ease both}
.hero svg{width:34px;height:34px;stroke:var(--gold);fill:none;stroke-width:1.1;margin-bottom:8px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.deco{position:absolute;color:var(--rose);opacity:.7;font-size:2rem;animation:float 6s ease-in-out infinite;pointer-events:none}
.d1{left:12%;top:60px}.d2{right:14%;top:96px;font-size:1.4rem;color:var(--gold);animation-delay:-2s}
.d3{left:22%;top:200px;font-size:1.2rem;animation-delay:-4s}.d4{right:24%;top:210px;animation-delay:-1s}
@keyframes float{50%{transform:translateY(-12px) rotate(6deg)}}
.cat{margin-top:40px}.cat:first-child{margin-top:6px}
.cat h2{font-size:1.9rem;color:var(--rose-deep);margin:0 0 18px;display:flex;align-items:center;gap:14px}
.cat h2::after{content:'';flex:1;height:1.5px;background:linear-gradient(90deg,rgba(242,167,184,.7),transparent)}
.filters{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;margin:0 0 28px;padding:14px 18px;border-radius:22px;background:rgba(255,255,255,.7);border:1.5px solid rgba(242,167,184,.35)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.95rem;border:1.5px solid var(--blush);background:#fff;color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer;transition:background .2s,transform .2s,border-color .2s}
.chip small{opacity:.6}
.chip:hover{transform:translateY(-1px);border-color:var(--rose)}
.chip.on{background:linear-gradient(135deg,var(--rose),var(--rose-deep));border-color:transparent;color:#fff}
.chip:focus-visible{outline:2px solid var(--lav-deep);outline-offset:3px}
.range{display:flex;align-items:center;gap:8px;font-size:.95rem}
.range input{width:92px;padding:7px 12px;border-radius:999px;text-align:center}
[hidden]{display:none!important}
.fly{position:fixed;pointer-events:none;z-index:9999;will-change:transform,opacity}
.total{display:inline-block;margin-top:24px;padding:10px 28px;border-radius:999px;background:rgba(255,255,255,.85);border:1.5px solid rgba(242,167,184,.55);box-shadow:var(--shadow);font-family:'Cormorant Garamond',Georgia,serif;font-size:1.6rem;font-weight:600;color:var(--rose-deep);animation:rise 1s .4s ease both}
.total small{display:block;font-family:'Nunito',sans-serif;font-size:.8rem;font-weight:400;color:var(--ink);opacity:.7}
main{max-width:1120px;margin:0 auto;padding:12px 20px 80px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px}
.card{
  position:relative;background:rgba(255,255,255,.92);border:1.5px solid rgba(242,167,184,.4);border-radius:28px;overflow:hidden;
  box-shadow:var(--shadow);display:flex;flex-direction:column;
  transition:transform .35s ease,box-shadow .35s ease;
}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(185,119,125,.25)}
.pic{aspect-ratio:4/5;background:linear-gradient(160deg,var(--lav),var(--blush));display:grid;place-items:center;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.card:hover .pic img{transform:scale(1.05)}
.pic svg{width:56px;height:56px;stroke:#fff;fill:none;stroke-width:1.1}
.body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:6px;flex:1}
.body h3{font-size:1.45rem}
.price{align-self:flex-start;background:var(--blush);color:var(--rose-deep);font-weight:600;border-radius:999px;padding:3px 14px;font-size:.95rem}
.actions{margin-top:auto;padding-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{
  font:inherit;font-weight:600;border:0;cursor:pointer;border-radius:999px;padding:10px 20px;
  background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff;
  box-shadow:0 6px 16px rgba(185,119,125,.3);transition:transform .2s,box-shadow .2s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(185,119,125,.38)}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.link{color:var(--lav-deep);text-decoration:none;font-size:.95rem;border-bottom:1px solid transparent}
.link:hover{border-color:var(--lav-deep)}
.btn:focus-visible,.link:focus-visible,input:focus-visible{outline:2px solid var(--lav-deep);outline-offset:3px}
.card.reserved{background:rgba(250,225,236,.9)}
.card.reserved .pic{filter:saturate(.6) opacity(.7)}
.link.cancel{background:none;border:0;cursor:pointer;font:inherit;font-size:.9rem;color:var(--rose-deep);padding:0;text-decoration:underline}
.badge{
  position:absolute;top:14px;left:14px;background:rgba(255,255,255,.92);color:var(--rose-deep);
  border-radius:999px;padding:6px 14px;font-weight:600;font-size:.9rem;box-shadow:var(--shadow);
}
.state{text-align:center;padding:50px 0;opacity:.8;font-size:1.1rem}
/* modal */
dialog{
  border:0;border-radius:28px;padding:34px 30px 28px;max-width:400px;width:calc(100% - 40px);
  background:var(--cream);color:var(--ink);box-shadow:0 30px 70px rgba(90,65,71,.3);
  margin:auto;animation:pop .3s ease;
}
dialog::backdrop{background:rgba(143,123,176,.35);backdrop-filter:blur(4px)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
dialog h2{font-size:1.9rem;margin-bottom:6px}
dialog p{font-size:.95rem;opacity:.85;margin-bottom:18px}
label{display:block;font-size:.9rem;margin:12px 0 4px}
input{
  width:100%;font:inherit;color:inherit;padding:11px 16px;border-radius:14px;
  border:1.5px solid var(--lav);background:#fff;
}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:1.5px solid var(--lav)}
.err{color:#b24a5a;font-size:.9rem;margin-top:10px;min-height:1.2em}
/* admin */
#admin{
  display:none;max-width:560px;margin:0 auto 44px;padding:26px 28px 30px;border-radius:26px;
  background:rgba(255,255,255,.8);box-shadow:var(--shadow);border:1.5px dashed var(--gold);
}
#admin h2{font-size:1.7rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="hero">
  <span class="deco d1" aria-hidden="true">♡</span><span class="deco d2" aria-hidden="true">✦</span>
  <span class="deco d3" aria-hidden="true">✦</span><span class="deco d4" aria-hidden="true">♡</span>
  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12M12 8c-2-4-6-3-5 0 .6 1.5 3 1 5 0zM12 8c2-4 6-3 5 0-.6 1.5-3 1-5 0z"/></svg>
  <h1>Мой вишлист</h1>
  <p>Если захочется меня порадовать — выбери подарок и нажми «Хочу подарить», чтобы никто не купил то же самое.</p>
  <div id="total" class="total" hidden></div>
</header>

<main>
  <section id="admin">
    <h2>Новое желание</h2>
    <form id="addForm">
      <label for="aUrl">Ссылка на товар в магазине</label>
      <input id="aUrl" type="url" placeholder="https://…">
      <div class="row" style="margin-top:10px"><button class="btn ghost" type="button" id="aFill">Подтянуть по ссылке</button></div>
      <label for="aTitle">Название</label><input id="aTitle" required maxlength="40">
      <label for="aPrice">Цена</label><input id="aPrice" placeholder="например, 3 490 ₽">
      <label for="aCat">Категория</label><input id="aCat" list="catList" maxlength="30" placeholder="например, Для дома"><datalist id="catList"></datalist>
      <label for="aImage">Ссылка на фото</label><input id="aImage" type="url" placeholder="https://… (прямая ссылка на картинку)">
      <div class="err" id="aErr" role="status"></div>
      <div class="row"><button class="btn" type="submit">Добавить в список</button></div>
    </form>
  </section>

  <div id="filters" class="filters" hidden>
    <div id="chips" class="chips"></div>
    <div class="range" role="group" aria-label="Фильтр по цене">
      <span>Цена, BYN</span>
      <input id="fMin" type="number" min="0" inputmode="decimal" placeholder="от" aria-label="Цена от">
      <input id="fMax" type="number" min="0" inputmode="decimal" placeholder="до" aria-label="Цена до">
      <button class="link cancel" id="fReset" type="button">Сбросить</button>
    </div>
  </div>
  <div id="grid"></div>
  <div id="state" class="state">Загружаем список…</div>
</main>

<dialog id="modal">
  <form id="reserveForm" method="dialog">
    <h2>Хочу подарить</h2>
    <p id="mTitle"></p>
    <label for="mName">Как тебя зовут?</label>
    <input id="mName" required maxlength="60" autocomplete="given-name">
    <div class="err" id="mErr" role="status"></div>
    <div class="row">
      <button class="btn ghost" type="button" id="mCancel">Отмена</button>
      <button class="btn" type="submit" id="mOk">Забронировать</button>
    </div>
  </form>
</dialog>

<script>
// ВСТАВЬ СЮДА URL веб-приложения Google Apps Script (заканчивается на /exec)
const API_URL = 'https://script.google.com/macros/s/AKfycbzMZFSyCg-GD0dY_r-8XhCfSj7HupXBJdv7WEE3hzJKbj8cJquTA6HdfMqzJqGSBb3OLA/exec';

const ADMIN_SECRET = new URLSearchParams(location.search).get('admin');
const $ = id => document.getElementById(id);
const grid = $('grid'), stateEl = $('state'), modal = $('modal');
let items = [], current = null, mine = {};
try { mine = JSON.parse(localStorage.getItem('wl_mine') || '{}'); } catch (_) {}
const saveMine = () => { try { localStorage.setItem('wl_mine', JSON.stringify(mine)); } catch (_) {} };

function burst(x, y, n = 14) {
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const set = ['🦄', '💖', '🦄', '💗', '✨', '💕'];
  const host = modal.open ? modal : document.body; // поверх открытого окна
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span');
    s.className = 'fly';
    s.textContent = set[Math.floor(Math.random() * set.length)];
    s.style.left = x + 'px'; s.style.top = y + 'px';
    s.style.fontSize = (1.1 + Math.random() * 1.2) + 'rem';
    host.appendChild(s);
    const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 120;
    const dx = Math.cos(a) * d, dy = Math.sin(a) * d - 60;
    s.animate([
      {transform: 'translate(-50%,-50%) scale(.3)', opacity: 1},
      {transform: `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(1) rotate(${(Math.random() - .5) * 60}deg)`, opacity: 1, offset: .6},
      {transform: `translate(calc(-50% + ${dx}px),calc(-50% + ${dy + 90}px)) scale(.8)`, opacity: 0}
    ], {duration: 1100 + Math.random() * 500, easing: 'cubic-bezier(.2,.7,.3,1)'}).onfinish = () => s.remove();
  }
}
document.addEventListener('click', e => {
  const b = e.target.closest('.btn:not(.ghost)');
  if (b) { const q = b.getBoundingClientRect(); burst(q.left + q.width / 2, q.top + q.height / 2); }
});

async function deleteItem(id, btn) {
  const it = items.find(i => String(i.id) === id);
  if (!confirm('Удалить «' + clip(it ? it.title : '') + '» из списка? Это нельзя отменить.')) return;
  btn.disabled = true;
  try {
    const r = await api({action: 'delete', id, secret: ADMIN_SECRET});
    if (r.ok) { await load(); return; }
    alert(r.error === 'forbidden' ? 'Неверный секрет в адресе страницы.' : 'Не получилось удалить.');
  } catch (_) { alert('Нет связи с сервером.'); }
  btn.disabled = false;
}

async function cancelReservation(id, btn) {
  let name = mine[id];
  if (ADMIN_SECRET) { if (!confirm('Снять бронь с этого подарка?')) return; }
  else if (!name) { name = (prompt('Введи имя, на которое оформляли бронь:') || '').trim(); if (!name) return; }
  else if (!confirm('Отменить бронь этого подарка?')) return;
  btn.disabled = true;
  try {
    const r = await api({action: 'cancel', id, name: name || '', secret: ADMIN_SECRET || ''});
    if (r.ok) { delete mine[id]; saveMine(); await load(); return; }
    alert(r.error === 'wrong_name' ? 'Имя не совпадает с тем, на которое оформляли бронь.' : 'Не получилось отменить бронь. Попробуй ещё раз.');
  } catch (_) { alert('Нет связи с сервером.'); }
  btn.disabled = false;
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clip = s => { s = String(s ?? ''); return s.length > 40 ? s.slice(0, 39).trimEnd() + '…' : s; };
const safeUrl = u => /^https?:\/\//i.test(u) ? esc(u) : '';
const GIFT = '<svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12M12 8c-2-4-6-3-5 0 .6 1.5 3 1 5 0zM12 8c2-4 6-3 5 0-.6 1.5-3 1-5 0z"/></svg>';

async function api(payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'}, // без preflight
    body: JSON.stringify(payload)
  });
  return res.json();
}

async function load() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    items = data.items || [];
    render();
  } catch (e) {
    stateEl.textContent = 'Не получилось загрузить список. Проверь API_URL и обнови страницу.';
  }
}

function priceInfo(s) {
  s = String(s ?? '').trim();
  const m = s.match(/\d[\d\s\u00a0]*(?:[.,]\d{1,2})?/);
  if (!m) return {};
  const foreign = /[₽$€₴]|\b(rub|usd|eur|pln)\b|руб/i.test(s) && !/byn|\bbr\b|бел/i.test(s);
  if (foreign) return {foreign: true};
  return {n: parseFloat(m[0].replace(/[\s\u00a0]/g, '').replace(',', '.'))};
}

function updateTotal() {
  let sum = 0, skipped = 0;
  items.forEach(it => { const p = priceInfo(it.price); if (p.foreign) skipped++; else if (p.n) sum += p.n; });
  const el = $('total');
  el.hidden = !sum;
  if (!sum) return;
  const fmt = sum.toLocaleString('ru-RU', {maximumFractionDigits: 2});
  el.innerHTML = 'Всего желаний на ' + esc(fmt) + ' BYN' +
    (skipped ? `<small>без ${skipped} шт. с ценой в другой валюте</small>` : '');
}

function cardHtml(it) {
    const img = safeUrl(it.image), link = safeUrl(it.url);
    return `<article class="card ${it.reserved ? 'reserved' : ''}">
      <div class="pic">${img ? `<img src="${img}" alt="${esc(it.title)}" loading="lazy" onerror="this.parentNode.innerHTML=GIFT">` : GIFT}</div>
      ${it.reserved ? '<span class="badge">Забронировано</span>' : ''}
      <div class="body">
        <h3 title="${esc(it.title)}">${esc(clip(it.title))}</h3>
        ${it.price ? `<div class="price">${esc(it.price)}</div>` : ''}
        <div class="actions">
          ${it.reserved ? `<button class="link cancel" data-cancel="${esc(it.id)}">Отменить бронь</button>` : `<button class="btn" data-id="${esc(it.id)}">Хочу подарить</button>`}
          ${link ? `<a class="link" href="${link}" target="_blank" rel="noopener">В магазин</a>` : ''}
          ${ADMIN_SECRET ? `<button class="link cancel" data-del="${esc(it.id)}">Удалить</button>` : ''}
        </div>
      </div>
    </article>`;
}

const catOf = it => String(it.category || '').trim() || 'Разное';
let fCat = '', fMin = null, fMax = null;

function passes(it) {
  if (fCat && catOf(it) !== fCat) return false;
  if (fMin === null && fMax === null) return true;
  const p = priceInfo(it.price);
  if (p.n === undefined || isNaN(p.n)) return false;
  return (fMin === null || p.n >= fMin) && (fMax === null || p.n <= fMax);
}

function render() {
  updateTotal();
  const cats = [...new Set(items.map(catOf))];
  if (fCat && !cats.includes(fCat)) fCat = '';
  $('catList').innerHTML = cats.map(c => `<option value="${esc(c)}">`).join('');
  $('filters').hidden = !items.length;
  $('chips').hidden = cats.length < 2;
  $('chips').innerHTML = ['', ...cats].map(c => {
    const n = c ? items.filter(i => catOf(i) === c).length : items.length;
    return `<button type="button" class="chip ${c === fCat ? 'on' : ''}" data-cat="${esc(c)}">${esc(c || 'Все')} <small>${n}</small></button>`;
  }).join('');
  const list = items.filter(passes);
  stateEl.style.display = list.length ? 'none' : 'block';
  stateEl.textContent = items.length ? 'Ничего не нашлось. Попробуй изменить фильтры.' : 'Пока здесь пусто — скоро появятся желания.';
  const groups = {};
  list.forEach(it => (groups[catOf(it)] = groups[catOf(it)] || []).push(it));
  grid.innerHTML = Object.keys(groups).map(c =>
    `<section class="cat"><h2>${esc(c)}</h2><div class="grid">${groups[c].map(cardHtml).join('')}</div></section>`).join('');
}

$('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if (!b) return;
  fCat = b.dataset.cat; render();
});
const readNum = v => { v = String(v).replace(',', '.').trim(); return v === '' || isNaN(+v) ? null : +v; };
['fMin', 'fMax'].forEach(id => $(id).addEventListener('input', () => {
  fMin = readNum($('fMin').value); fMax = readNum($('fMax').value); render();
}));
$('fReset').onclick = () => { fCat = ''; fMin = fMax = null; $('fMin').value = ''; $('fMax').value = ''; render(); };

grid.addEventListener('click', e => {
  const del = e.target.closest('button[data-del]');
  if (del) return deleteItem(del.dataset.del, del);
  const c = e.target.closest('button[data-cancel]');
  if (c) return cancelReservation(c.dataset.cancel, c);
  const b = e.target.closest('button[data-id]');
  if (!b) return;
  current = items.find(i => String(i.id) === b.dataset.id);
  $('mTitle').textContent = clip(current.title);
  $('mErr').textContent = '';
  modal.showModal();
  $('mName').focus();
});
$('mCancel').onclick = () => modal.close();

$('reserveForm').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('mName').value.trim();
  if (!name || !current) return;
  const ok = $('mOk'); ok.disabled = true; $('mErr').textContent = '';
  try {
    const r = await api({action: 'reserve', id: current.id, name});
    if (r.ok) { mine[current.id] = name; saveMine(); current.reserved = true; modal.close(); render(); $('mName').value = ''; burst(innerWidth / 2, innerHeight / 2, 36); }
    else if (r.error === 'already_reserved') { $('mErr').textContent = 'Этот подарок уже забронировали.'; await load(); }
    else $('mErr').textContent = 'Не получилось забронировать. Попробуй ещё раз.';
  } catch (_) { $('mErr').textContent = 'Нет связи с сервером. Попробуй ещё раз.'; }
  ok.disabled = false;
});

// Админ-панель: видна только при ?admin=секрет, пароль проверяет сервер
if (ADMIN_SECRET) {
  $('admin').style.display = 'block';
  $('aFill').addEventListener('click', async () => {
    const url = $('aUrl').value.trim(), err = $('aErr'), btn = $('aFill');
    if (!url) { err.textContent = 'Сначала вставь ссылку на товар.'; return; }
    btn.disabled = true; err.textContent = 'Ищем данные на странице…';
    try {
      const r = await api({action: 'preview', secret: ADMIN_SECRET, url});
      if (!r.ok) { err.textContent = r.error === 'forbidden' ? 'Неверный секрет в адресе страницы.' : 'Не получилось открыть страницу.'; }
      else {
        if (r.title) $('aTitle').value = clip(r.title);
        if (r.price) $('aPrice').value = r.price;
        if (r.image) $('aImage').value = r.image;
        const miss = [!r.title && 'название', !r.price && 'цену', !r.image && 'фото'].filter(Boolean);
        err.textContent = miss.length ? 'Не нашлось: ' + miss.join(', ') + '. Заполни вручную.' : 'Готово. Проверь цену и нажми «Добавить».';
      }
    } catch (_) { err.textContent = 'Нет связи с сервером.'; }
    btn.disabled = false;
  });
  $('addForm').addEventListener('submit', async e => {
    e.preventDefault();
    const err = $('aErr'); err.textContent = 'Добавляем…';
    try {
      const r = await api({
        action: 'add', secret: ADMIN_SECRET,
        title: $('aTitle').value.trim(), price: $('aPrice').value.trim(),
        image: $('aImage').value.trim(), url: $('aUrl').value.trim(), category: $('aCat').value.trim()
      });
      if (r.ok) { err.textContent = 'Готово! Желание добавлено.'; e.target.reset(); await load(); }
      else err.textContent = r.error === 'forbidden' ? 'Неверный секрет в адресе страницы.' : 'Не получилось добавить.';
    } catch (_) { err.textContent = 'Нет связи с сервером.'; }
  });
}

load();
</script>
</body>
</html>
